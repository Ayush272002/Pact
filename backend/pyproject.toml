[project]
name = "backend"
version = "0.1.0"
description = "Backend for the Modern Next.js + FastAPI template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "langchain-anthropic>=1.3.1",
    "langgraph>=1.0.7",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.11",
]
